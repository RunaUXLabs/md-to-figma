    .template-section {

    }

    .textarea-section {

    .textarea-label {

    textarea {

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;

      font-weight: 600;

    }

    .log-entry.success {
      color: #98c379;
    }

    .log-entry.warning {
      color: #e5c07b;
    }

    .log-entry.error {
      color: #e06c75;
    }

    .error-box {
      background: #2d1f1f;
      border: 1px solid #e06c75;
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;

      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      gap: 8px;

    .error-box-title {

      font-weight: 600;
      font-size: 11px;
      flex: 1;
    }

      font-size: 10px;
      background: #e06c75;
      color: white;
      border: none;
      border-radius: 4px;

    }

    .error-box-content {
      color: #abb2bf;
      font-size: 10px;
      white-space: pre-wrap;
    }

      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;

      font-weight: 600;
      font-size: 12px;
      margin-bottom: 8px;
    }

      gap: 4px;
      color: #abb2bf;
      font-size: 10px;
    }

    .modal-footer {

      gap: 8px;
      padding: 16px 20px;
      border-top: 1px solid #e0e0e0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .status-badge.running {
      background: #fff3cd;
      color: #856404;
    }

    .status-badge.success {
      background: #d4edda;
      color: #155724;
    }

    .status-badge.error {
      background: #f8d7da;
      color: #721c24;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;

    @keyframes spin {
      to {

      padding: 16px;

      border: 1px solid #d0d0d0;

      margin-bottom: 12px;

    .toast {

      left: 50%;
      transform: translateX(-50%);

      color: white;
      padding: 10px 20px;
      border-radius: 6px;

</head>

  <script>
    var TEMPLATE_MD = `# Design System

<!--
📌 작성 규칙

[형식]
- 컬러: HEX 6자리 (#ffffff) 또는 rgba(0,0,0,0.1)
- 크기: 숫자+px 필수 (16px, -1.5px)
- LineHeight: 소수점 (1.5) 또는 퍼센트 (150%)
- 빈 값: - 로 표기

[토큰 구조]
- Primitive: 기본 색상 팔레트 (원시값, 모드 무관)
- Semantic: 용도별 색상 (Light/Dark 모드별 Alias 지정)

[다크모드 규칙]
⚠️ 중요: Primitive에 Light/Dark 모두에서 사용할 모든 원시 컬러를 먼저 정의

1. Primitive 정의 (원시값)
   - Light 모드에서 사용할 컬러 정의
   - Dark 모드에서 사용할 컬러도 함께 정의

2. Semantic 정의 (Alias)
   - Light 컬럼: Light 모드에서 사용할 Primitive 토큰명
   - Dark 컬럼: Dark 모드에서 사용할 Primitive 토큰명
   - ⚠️ HEX 직접 입력 금지 — 반드시 Primitive 토큰명(Alias) 사용

[다크모드 추론 가이드]
원본에 다크모드가 없으면 아래 패턴으로 추론:
- surface/canvas: Light=white → Dark=gray-900
- surface/card: Light=white → Dark=gray-800
- surface/elevated: Light=gray-50 → Dark=gray-700
- text/default: Light=gray-900 → Dark=gray-50
- text/muted: Light=gray-500 → Dark=gray-400
- border/default: Light=gray-200 → Dark=gray-700
- brand/primary: 보통 동일하게 유지
- feedback/*: 동일하거나 밝기 +10~20%

[네이밍]
- 허용: 영문, 숫자, /, -, _
- 금지: 공백, 괄호, 특수문자
- ⚠️ 숫자로 시작 금지
- 경로 구분: / 사용 (group/token)

[Typography 그룹핑]
- ### 그룹명 으로 그룹 구분 (예: ### Display)
- 예: ### Display 아래 xl → display/xl
-->

    var mdContent = document.getElementById('mdContent');
    var generateBtn = document.getElementById('generateBtn');
    var cancelBtn = document.getElementById('cancelBtn');
    var modalOverlay = document.getElementById('modalOverlay');
    var logContainer = document.getElementById('logContainer');
    var copyLogBtn = document.getElementById('copyLogBtn');
    var closeModalBtn = document.getElementById('closeModalBtn');
    var statusBadge = document.getElementById('statusBadge');
    var toast = document.getElementById('toast');
    var downloadTemplateBtn = document.getElementById('downloadTemplateBtn');
    var downloadGuideBtn = document.getElementById('downloadGuideBtn');
    var copyModalOverlay = document.getElementById('copyModalOverlay');
    var copyTextarea = document.getElementById('copyTextarea');
    var closeCopyModalBtn = document.getElementById('closeCopyModalBtn');
    var logText = '';

    downloadTemplateBtn.onclick = function () { downloadFile('DESIGN-TEMPLATE.md', TEMPLATE_MD); showToast('📥 템플릿 다운로드 완료!'); };
    downloadGuideBtn.onclick = function () { downloadFile('AI-PROMPT-GUIDE.md', AI_PROMPT_GUIDE); showToast('📥 AI 가이드 다운로드 완료!'); };

    function downloadFile(filename, content) {
      var blob = new Blob([content], { type: 'text/markdown' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    generateBtn.onclick = function () {
      var content = mdContent.value.trim();
      if (!content) { showToast('⚠️ 내용을 붙여넣으세요'); return; }
      openModal();
      generateBtn.disabled = true;
      var options = {
        variables: {
          colors: document.getElementById('optVarColors').checked,
          spacing: document.getElementById('optVarSpacing').checked,
          radius: document.getElementById('optVarRadius').checked,
          typography: document.getElementById('optVarTypography').checked
        },
        styles: {
          color: document.getElementById('optColorStyles').checked,
          text: document.getElementById('optTextStyles').checked,
          effect: document.getElementById('optEffectStyles').checked,
          grid: document.getElementById('optGridStyles').checked
        }
      };
      parent.postMessage({ pluginMessage: { type: 'generate', content: content, options: options } }, '*');
    };

    cancelBtn.onclick = function () { parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*'); };

    function openModal() {
      logContainer.innerHTML = '<div class="log-entry info">🚀 생성을 시작합니다...</div>';
      logText = '🚀 생성을 시작합니다...\n';
      closeModalBtn.disabled = true;
      statusBadge.className = 'status-badge running';
      statusBadge.innerHTML = '<span class="spinner"></span>진행 중';
      modalOverlay.classList.add('show');
    }

    function addLog(type, message) {
      var entry = document.createElement('div');
      entry.className = 'log-entry ' + type;
      entry.textContent = message;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
      logText += message + '\n';
    }

    function addErrorBox(message, detail, copyable) {
      var box = document.createElement('div');
      box.className = 'error-box';
      box.innerHTML = '<div class="error-box-header"><span class="error-box-title">❌ ' + message + '</span></div>' +
        '<div class="error-box-content">' + detail + '</div>';
      logContainer.appendChild(box);
      logContainer.scrollTop = logContainer.scrollHeight;
      setStatus('error');
    }

    function addResultSummary(results) {
      var box = document.createElement('div');
      box.className = 'result-summary';
      box.innerHTML = '<div class="result-summary-title">🎉 생성 완료!</div>' +
        '<div class="result-grid">' +
        '<div>Colors: ' + results.variables.colors + '개</div>' +
        '<div>Spacing: ' + results.variables.spacing + '개</div>' +
        '<div>Radius: ' + results.variables.radius + '개</div>' +
        '<div>Typography: ' + results.variables.typography + '개</div>' +
        '<div>Color Styles: ' + results.styles.color + '개</div>' +
        '<div>Text Styles: ' + results.styles.text + '개</div>' +
        '<div>Effect Styles: ' + results.styles.effect + '개</div>' +
        '<div>Grid Styles: ' + results.styles.grid + '개</div>' +
        '</div>';
      logContainer.appendChild(box);
      logContainer.scrollTop = logContainer.scrollHeight;
      setStatus('success');
    }

    function setStatus(status) {
      closeModalBtn.disabled = false;
      if (status === 'success') { statusBadge.className = 'status-badge success'; statusBadge.innerHTML = '✅ 완료'; }
      else { statusBadge.className = 'status-badge error'; statusBadge.innerHTML = '❌ 오류 발생'; }
    }

    function showToast(message) {
      toast.textContent = message; toast.classList.add('show');
      setTimeout(function () { toast.classList.remove('show'); }, 2500);
    }

    closeModalBtn.onclick = function () { modalOverlay.classList.remove('show'); generateBtn.disabled = false; };
    copyLogBtn.onclick = function () { copyTextarea.value = logText; copyModalOverlay.classList.add('show'); copyTextarea.select(); };
    closeCopyModalBtn.onclick = function () { copyModalOverlay.classList.remove('show'); };

    window.onmessage = function (event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'log') addLog(msg.logType, msg.message);
      else if (msg.type === 'error') addErrorBox(msg.message, msg.detail, msg.copyable);
      else if (msg.type === 'complete') addResultSummary(msg.results);
    };
  </script>
