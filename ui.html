<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD to Figma</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
      padding: 20px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .template-section {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn-template {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      background: #f0f7ff;
      border: 1px solid #c2dcf7;
      border-radius: 8px;
      color: #1a73e8;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-template:hover {
      background: #e3f0ff;
      border-color: #a8c9f0;
    }

    .textarea-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
      min-height: 0;
    }

    .textarea-label {
      font-size: 12px;
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    textarea {
      flex: 1;
      width: 100%;
      padding: 12px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
      resize: none;
      line-height: 1.5;
    }

    textarea:focus {
      outline: none;
      border-color: #18a0fb;
      box-shadow: 0 0 0 2px rgba(24, 160, 251, 0.2);
    }

    .options-section {
      padding: 12px;
      background: #f8f8f8;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .options-group {
      margin-bottom: 12px;
    }

    .options-group:last-child {
      margin-bottom: 0;
    }

    .options-divider {
      height: 1px;
      background: #e0e0e0;
      margin: 12px 0;
    }

    .options-title {
      font-size: 11px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .option-item input[type="checkbox"] {
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: #18a0fb;
    }

    .button-section {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      flex: 1;
      background: #18a0fb;
      color: white;
    }

    .btn-primary:hover {
      background: #0d8de5;
    }

    .btn-export {
      flex: 1;
      background: #2c2c2c;
      color: white;
    }

    .btn-export:hover {
      background: #000000;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px 0 20px;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
    }

    .modal-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .tabs {
      display: flex;
      gap: 16px;
      border-bottom: 1px solid transparent;
    }

    .tab {
      padding: 8px 4px;
      font-size: 13px;
      font-weight: 500;
      color: #666;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      position: relative;
      top: 1px;
    }

    .tab.active {
      color: #1a1a1a;
      border-bottom-color: #1a1a1a;
    }

    .tab-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 4px;
    }

    .tab.active #badgeError {
      background: #fee2e2;
      color: #dc2626;
    }

    .tab.active #badgeQA {
      background: #e0e7ff;
      color: #2563eb;
    }

    #badgeError {
      background: #f3f4f6;
      color: #9ca3af;
    }

    #badgeQA {
      background: #f3f4f6;
      color: #9ca3af;
    }

    .tab-content {
      display: none;
      flex: 1;
      overflow-y: auto;
      background: #1e1e1e;
      padding: 16px;
      height: 300px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
      line-height: 1.6;
    }

    .tab-content.active {
      display: block;
    }

    .log-entry {
      margin-bottom: 6px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-entry.info {
      color: #9da5b4;
    }

    .log-entry.qa {
      color: #61afef;
      padding-left: 12px;
      border-left: 3px solid #61afef;
    }

    .log-entry.error {
      color: #e06c75;
      background: #2d1f1f;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #e06c75;
    }

    .log-entry.success {
      color: #98c379;
      font-weight: 600;
    }

    .modal-footer {
      display: flex;
      gap: 8px;
      padding: 16px 20px;
      border-top: 1px solid #e0e0e0;
      background: white;
      justify-content: flex-end;
    }

    .modal-footer .btn {
      flex: none;
      min-width: 80px;
    }

    .btn-copy-error {
      background: #fee2e2;
      color: #dc2626;
      display: none;
    }

    .btn-copy-error:hover {
      background: #fecaca;
    }

    .btn-copy-qa {
      background: #e0e7ff;
      color: #2563eb;
      display: none;
    }

    .btn-copy-qa:hover {
      background: #dbeafe;
    }

    .btn-close-modal {
      background: #f0f0f0;
      color: #666;
    }

    .btn-close-modal:hover {
      background: #e5e5e5;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 3000;
    }

    .toast.show {
      opacity: 1;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .status-badge.running {
      background: #fff3cd;
      color: #856404;
    }

    .status-badge.success {
      background: #d4edda;
      color: #155724;
    }

    .status-badge.error {
      background: #f8d7da;
      color: #721c24;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>📦 MD to Figma</h1>
  </div>

  <div class="template-section">
    <button class="btn-template" id="downloadTemplateBtn">📥 템플릿 받기</button>
    <button class="btn-template" id="downloadGuideBtn">📖 AI 가이드</button>
  </div>

  <div class="textarea-section">
    <div class="textarea-label">제공된 템플릿을 AI에게 제공하고 데이터를 맵핑해달라고 요청하세요.<br>그 결과인 DESIGN.md 내용을 아래에 붙여넣으세요.</div>
    <textarea id="mdContent" placeholder="# Design System..."></textarea>
  </div>

  <div class="options-section">
    <div class="options-group">
      <div class="options-title">📦 Variables (컬렉션 분리 생성)</div>
      <div class="options-grid">
        <div class="option-item"><input type="checkbox" id="optVarColors" checked><label
            for="optVarColors">Colors</label></div>
        <div class="option-item"><input type="checkbox" id="optVarSpacing" checked><label
            for="optVarSpacing">Spacing</label></div>
        <div class="option-item"><input type="checkbox" id="optVarRadius" checked><label
            for="optVarRadius">Radius</label></div>
        <div class="option-item"><input type="checkbox" id="optVarTypography" checked><label
            for="optVarTypography">Typography</label></div>
      </div>
    </div>
    <div class="options-divider"></div>
    <div class="options-group">
      <div class="options-title">🎨 Styles (Variable 연동)</div>
      <div class="options-grid">
        <div class="option-item"><input type="checkbox" id="optColorStyles"><label for="optColorStyles">Color
            Styles</label></div>
        <div class="option-item"><input type="checkbox" id="optTextStyles" checked><label for="optTextStyles">Text
            Styles</label></div>
        <div class="option-item"><input type="checkbox" id="optEffectStyles" checked><label for="optEffectStyles">Effect
            Styles</label></div>
        <div class="option-item"><input type="checkbox" id="optGridStyles" checked><label for="optGridStyles">Grid
            Styles</label></div>
      </div>
    </div>
  </div>

  <div class="button-section">
    <button class="btn btn-primary" id="generateBtn">🚀 등록 (MD → Figma)</button>
    <button class="btn btn-export" id="exportBtn">📤 추출 (Figma → MD)</button>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title-row">
          <span class="modal-title" id="modalTitle">실행 리포트</span>
          <span class="status-badge running" id="statusBadge"><span class="spinner"></span>작업 중</span>
        </div>
        <div class="tabs">
          <div class="tab" id="tabQA" onclick="switchTab('qa')">🔵 실행 로그/QA <span class="tab-badge" id="badgeQA">0</span></div>
          <div class="tab" id="tabError" onclick="switchTab('error')">🔴 해결 필요 <span class="tab-badge" id="badgeError">0</span></div>
        </div>
      </div>
      <div class="tab-content" id="contentQA"></div>
      <div class="tab-content" id="contentError"></div>
      <div class="modal-footer">
        <button class="btn btn-copy-qa" id="copyQABtn">리포트 복사</button>
        <button class="btn btn-copy-error" id="copyErrorBtn">브리핑 복사</button>
        <button class="btn btn-close-modal" id="closeModalBtn" disabled>닫기</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var TEMPLATE_MD = `# Design System

<!--
📌 작성 규칙 (v2.3.1)

[형식]
- 컬러: HEX 6자리 (#ffffff) 또는 rgba(0,0,0,0.1)
- 크기: 숫자+px 필수 (16px, -1.5px)
- LineHeight (중요): 
  1. % 또는 소수점(1.5 등): 피그마 스타일에 %로 직접 입력됨 (바인딩 해제, 퍼센트 값 보존)
  2. px 명시 (24px 등): 피그마 배리어블과 스타일이 바인딩됨 (시스템 일관성 유지)
- Weight: 숫자(400, 700) 또는 이름(Regular, Bold). 피그마 스타일명과 일치 권장.
- 빈 값: - 로 표기

[시멘틱 타이포그래피 규칙]
- FontFamily 배리어블은 'fontFamily/primary', 'fontFamily/secondary' 이름으로 자동 생성됩니다.
- FontWeight 배리어블은 'fontWeight/400', 'fontWeight/700' 처럼 입력된 값을 이름으로 생성하며 스타일명이 값으로 할당됩니다.
- MD에 적힌 폰트명이 이 변수의 '값'으로 할당됩니다.
- 폰트가 시스템에 없을 경우 변수의 '값'만 'Inter'로 자동 업데이트되어 일괄 반영됩니다.

[토큰 구조]
- Primitive: 기본 색상 팔레트 (원시값, 모드 무관)
- Semantic: 용도별 색상 (Light/Dark 모드별 Alias 지정)

[Typography 그룹핑]
- ### 그룹명 으로 그룹 구분 (예: ### Display)
- 예: ### Display 아래 xl -> display/xl
-->


## Colors

### Primitive

| Token | Value | Description |
|-------|-------|-------------|
| coral/500 | #cc785c | 코랄 기본 |
| coral/600 | #a9583e | 코랄 어두움 |
| coral/300 | #e8a990 | 코랄 밝음 |
| navy/900 | #181715 | 네이비 가장 어두움 |
| neutral/white | #ffffff | 화이트 |
| neutral/gray-900 | #171717 | 다크 그레이 가장 어두움 |

### Semantic

| Token | Light | Dark | Description |
|-------|-------|------|-------------|
| brand/primary | coral/500 | coral/500 | 메인 브랜드 |
| surface/canvas | neutral/white | neutral/gray-900 | 기본 배경 |
| text/default | navy/900 | neutral/white | 기본 텍스트 |


## Spacing

### Primitive

| Token | Value | Description |
|-------|-------|-------------|
| space-16 | 16px | 기본 단위 |

### Semantic

| Token | Alias | Description |
|-------|-------|-------------|
| md | space-16 | 중간 |


## Radius

### Primitive

| Token | Value | Description |
|-------|-------|-------------|
| radius-8 | 8px | 기본 |

### Semantic

| Token | Alias | Description |
|-------|-------|-------------|
| md | radius-8 | 중간 |


## Typography

### Display

| Token | Font | Size | Weight | LineHeight | LetterSpacing |
|-------|------|------|--------|------------|---------------|
| xl | Inter | 64px | 700 | 110% | -1px |
| lg | Inter | 48px | 700 | 1.2 | -0.5px |

### Body

| Token | Font | Size | Weight | LineHeight | LetterSpacing |
|-------|------|------|--------|------------|---------------|
| md | Inter | 16px | 400 | 150% | 0px |
| sm | Inter | 14px | 400 | 24px | 0px |


## Effects

| Token | Type | Color | X | Y | Blur | Spread |
|-------|------|-------|---|---|------|--------|
| shadow-md | drop-shadow | rgba(0,0,0,0.12) | 0 | 4px | 8px | 0 |


## Grid

| Token | Type | Count | Width | Gutter | Margin | Alignment |
|-------|------|-------|-------|--------|--------|-----------|
| columns-12 | columns | 12 | auto | 24px | 48px | stretch |`;

    var AI_PROMPT_GUIDE = `# 🚀 MD to Figma: Global AI Prompt Guide (v2.3.1)

Register your entire design system into Figma Variables & Styles in seconds. This guide helps you bridge the gap between your documentation and Figma using the power of AI.

---

## 📋 The Workflow

### 1. Download the Template
- Click **📥 Template Download** in the plugin to get \`DESIGN-TEMPLATE.md\`.
- This file defines the only data structure the plugin recognizes.

### 2. Instruct Your AI
- Attach the \`DESIGN-TEMPLATE.md\` file to your AI (ChatGPT, Claude, etc.).
- Provide your project's raw design data (CSS, JSON, etc.).
- Use the **Master Prompt** provided below.

### 3. Generate & Sync
- Copy the Markdown block from the AI.
- Paste it into the plugin and click **🚀 Generate**.

---

## 🤖 The Master Prompt

> "I have attached a \`DESIGN-TEMPLATE.md\` file that defines a specific structure for a Figma plugin. 
> 
> Please analyze my project's design system data and **restructure it exactly** into the format defined in the template. 
> 
> **CRITICAL COMPLIANCE RULES:**
> 1. **Color Aliasing**: In the 'Semantic' table, values MUST reference names from the 'Primitive' table (e.g., \`blue/500\`). **Never use HEX codes in Semantic tables.**
2. \`LineHeight Smart Units\`: 
    - Use \`%\` (e.g., \`150%\`) or unitless decimals (e.g., \`1.5\`) for flexible web-based styles. These will be entered as raw percentages in Figma Styles to preserve precision.
    - Use \`px\` (e.g., \`24px\`) ONLY if fixed pixel height and Variable Binding are required.
3. \`Grid Inference\`: If grid data is missing or insufficient, please infer a standard layout system (Columns: 2/4/12, Gutter: 16/24px, Margin: auto) and baseline grids (4px/8px) based on the template.
4. \`Typography Grouping\`: Use \`### Heading\` syntax to group typography tokens (e.g., \`### Display\`).
> 4. **Font Safety**: If specifying a custom font, don't worry if it's not installed. The plugin will automatically fallback to 'Inter Regular' and link it to an auto-generated 'fontFamily/Inter' variable for a clean, error-free system.
> 
> Output the result as a single, complete Markdown code block."

---

## 💡 Pro Tips for Success
- **Unit Precision**: The plugin is smart—it knows that \`%\` in the doc means "don't bind to variables, keep it as % in the style".
- **Batch Processing**: Supports partial updates. Sync Colors first, then others later.
- **Natural Sorting**: Token names like \`gray/100\`, \`gray/200\` are automatically sorted numerically in Figma.

---
*Automate your design system workflow globally with MD to Figma!*`;

    var mdContent = document.getElementById('mdContent');
    var modalOverlay = document.getElementById('modalOverlay');
    var contentError = document.getElementById('contentError');
    var contentQA = document.getElementById('contentQA');
    var badgeError = document.getElementById('badgeError');
    var badgeQA = document.getElementById('badgeQA');
    var copyErrorBtn = document.getElementById('copyErrorBtn');
    var copyQABtn = document.getElementById('copyQABtn');
    var closeModalBtn = document.getElementById('closeModalBtn');
    var statusBadge = document.getElementById('statusBadge');
    var toast = document.getElementById('toast');

    var errorLogs = [];
    var qaLogs = [];

    document.getElementById('downloadTemplateBtn').onclick = () => downloadFile('DESIGN-TEMPLATE.md', TEMPLATE_MD);
    document.getElementById('downloadGuideBtn').onclick = () => downloadFile('AI-PROMPT-GUIDE.md', AI_PROMPT_GUIDE);

    function downloadFile(filename, content) {
      var blob = new Blob([content], { type: 'text/markdown' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); showToast('📥 다운로드 완료!');
    }

    document.getElementById('generateBtn').onclick = function () {
      var content = mdContent.value.trim();
      if (!content) { showToast('⚠️ 내용을 붙여넣으세요'); return; }
      openModal('등록 중...');
      var options = {
        variables: {
          colors: document.getElementById('optVarColors').checked,
          spacing: document.getElementById('optVarSpacing').checked,
          radius: document.getElementById('optVarRadius').checked,
          typography: document.getElementById('optVarTypography').checked
        },
        styles: {
          color: document.getElementById('optColorStyles').checked,
          text: document.getElementById('optTextStyles').checked,
          effect: document.getElementById('optEffectStyles').checked,
          grid: document.getElementById('optGridStyles').checked
        }
      };
      parent.postMessage({ pluginMessage: { type: 'generate', content: content, options: options } }, '*');
    };

    document.getElementById('exportBtn').onclick = function () {
      openModal('데이터 추출 중...');
      parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
    };

    function openModal(title) {
      document.getElementById('modalTitle').textContent = title;
      errorLogs = []; qaLogs = [];
      contentError.innerHTML = ''; contentQA.innerHTML = '';
      updateBadges();
      closeModalBtn.disabled = true;
      statusBadge.className = 'status-badge running';
      statusBadge.innerHTML = '<span class="spinner"></span>진행 중';
      modalOverlay.classList.add('show');
      switchTab('qa');
    }

    function switchTab(tabId) {
      document.getElementById('tabError').classList.remove('active');
      document.getElementById('tabQA').classList.remove('active');
      contentError.classList.remove('active');
      contentQA.classList.remove('active');
      if (tabId === 'error') {
        document.getElementById('tabError').classList.add('active');
        contentError.classList.add('active');
      } else {
        document.getElementById('tabQA').classList.add('active');
        contentQA.classList.add('active');
      }
    }

    function updateBadges() {
      badgeError.textContent = errorLogs.length;
      badgeQA.textContent = qaLogs.length;
      if (errorLogs.length > 0) switchTab('error');
    }

    copyErrorBtn.onclick = function () {
      var prompt = "--- [에러 리포트] ---\n" + errorLogs.join('\n');
      copyToClipboard(prompt, '🔴 에러 브리핑 복사 완료!');
    };

    copyQABtn.onclick = function () {
      var prompt = "--- [디자인 시스템 실행 리포트] ---\n" + qaLogs.join('\n');
      copyToClipboard(prompt, '🔵 리포트 복사 완료!');
    };

    function copyToClipboard(text, successMsg) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        const successful = document.execCommand('copy');
        if (successful) showToast(successMsg);
        else showToast('❌ 복사에 실패했습니다.');
      } catch (err) {
        showToast('❌ 복사 권한 에러');
      }
      document.body.removeChild(textarea);
    }

    function showToast(message) {
      toast.textContent = message; toast.classList.add('show');
      setTimeout(function () { toast.classList.remove('show'); }, 2500);
    }

    closeModalBtn.onclick = function () { modalOverlay.classList.remove('show'); };

    window.onmessage = function (event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'log') {
        qaLogs.push(msg.message);
        var entry = document.createElement('div');
        entry.className = 'log-entry info';
        entry.textContent = msg.message;
        contentQA.appendChild(entry);
        contentQA.scrollTop = contentQA.scrollHeight;
        updateBadges();
      }
      else if (msg.type === 'qa_log') {
        qaLogs.push("QA: " + msg.message);
        var entry = document.createElement('div');
        entry.className = 'log-entry qa';
        entry.textContent = "ℹ️ " + msg.message;
        contentQA.appendChild(entry);
        contentQA.scrollTop = contentQA.scrollHeight;
        updateBadges();
      }
      else if (msg.type === 'error') {
        var fullError = msg.message + (msg.detail ? "\n상세: " + msg.detail : "");
        errorLogs.push(fullError);
        var entry = document.createElement('div');
        entry.className = 'log-entry error';
        entry.textContent = "❌ " + fullError;
        contentError.appendChild(entry);
        contentError.scrollTop = contentError.scrollHeight;
        updateBadges();
        
        closeModalBtn.disabled = false;
        statusBadge.className = 'status-badge error';
        statusBadge.innerHTML = '⚠️ 에러 발생';
        copyErrorBtn.style.display = 'block';
        copyQABtn.style.display = 'block';
      }
      else if (msg.type === 'complete' || msg.type === 'export_complete') {
        closeModalBtn.disabled = false;
        statusBadge.className = errorLogs.length === 0 ? 'status-badge success' : 'status-badge error';
        statusBadge.innerHTML = errorLogs.length === 0 ? '✅ 완료' : '⚠️ 에러 있음';

        if (msg.type === 'export_complete') {
          document.getElementById('modalTitle').textContent = '✅ 추출 완료';
          downloadFile('EXPORTED-DESIGN.md', msg.mdContent);
          var entry = document.createElement('div');
          entry.className = 'log-entry success';
          entry.textContent = "\n✅ 디자인 시스템 데이터 추출 및 다운로드가 완료되었습니다.";
          contentQA.appendChild(entry);
          copyQABtn.style.display = 'block';
        } else if (msg.type === 'complete') {
          document.getElementById('modalTitle').textContent = '🎉 등록 완료';
          var summary = `\n--- [등록 요약] ---\n`;
          summary += `• 배리어블: Color(${msg.results.variables.colors}), Spacing(${msg.results.variables.spacing}), Radius(${msg.results.variables.radius}), Typography(${msg.results.variables.typography})\n`;
          summary += `• 스타일: Color(${msg.results.styles.color}), Text(${msg.results.styles.text}), Effect(${msg.results.styles.effect}), Grid(${msg.results.styles.grid})\n`;
          
          qaLogs.push(summary);
          var entry = document.createElement('div');
          entry.className = 'log-entry success';
          entry.textContent = summary + "\n🎉 모든 시스템이 성공적으로 이식되었습니다!";
          contentQA.appendChild(entry);
          contentQA.scrollTop = contentQA.scrollHeight;
          copyErrorBtn.style.display = 'block';
          copyQABtn.style.display = 'block';
        }
      }
    };
  </script>
</body>

</html>
