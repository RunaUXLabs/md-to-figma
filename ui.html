<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD to Figma</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
      padding: 20px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .template-section {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn-template {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      background: #f0f7ff;
      border: 1px solid #c2dcf7;
      border-radius: 8px;
      color: #1a73e8;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-template:hover {
      background: #e3f0ff;
      border-color: #a8c9f0;
    }

    .textarea-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
      min-height: 0;
    }

    .textarea-label {
      font-size: 12px;
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    textarea {
      flex: 1;
      width: 100%;
      padding: 12px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
      resize: none;
      line-height: 1.5;
    }

    textarea:focus {
      outline: none;
      border-color: #18a0fb;
      box-shadow: 0 0 0 2px rgba(24, 160, 251, 0.2);
    }

    /* 옵션 섹션 복구 */
    .options-section {
      padding: 12px;
      background: #f8f8f8;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .options-group {
      margin-bottom: 12px;
    }

    .options-group:last-child {
      margin-bottom: 0;
    }

    .options-divider {
      height: 1px;
      background: #e0e0e0;
      margin: 12px 0;
    }

    .options-title {
      font-size: 11px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .option-item input[type="checkbox"] {
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: #18a0fb;
    }

    .button-section {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #18a0fb;
      color: white;
    }

    .btn-primary:hover {
      background: #0d8de5;
    }

    .btn-export {
      background: #2c2c2c;
      color: white;
    }

    .btn-export:hover {
      background: #000000;
    }

    /* 새 모달 및 탭 UI */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px 0 20px;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
    }

    .modal-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .tabs {
      display: flex;
      gap: 16px;
      border-bottom: 1px solid transparent;
    }

    .tab {
      padding: 8px 4px;
      font-size: 13px;
      font-weight: 500;
      color: #666;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      position: relative;
      top: 1px;
    }

    .tab.active {
      color: #1a1a1a;
      border-bottom-color: #1a1a1a;
    }

    .tab-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 4px;
    }

    .tab.active #badgeError {
      background: #fee2e2;
      color: #dc2626;
    }

    .tab.active #badgeQA {
      background: #e0e7ff;
      color: #2563eb;
    }

    #badgeError {
      background: #f3f4f6;
      color: #9ca3af;
    }

    #badgeQA {
      background: #f3f4f6;
      color: #9ca3af;
    }

    .tab-content {
      display: none;
      flex: 1;
      overflow-y: auto;
      background: #1e1e1e;
      padding: 16px;
      height: 300px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
      line-height: 1.6;
    }

    .tab-content.active {
      display: block;
    }

    .log-entry {
      margin-bottom: 6px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-entry.info {
      color: #9da5b4;
    }

    .log-entry.qa {
      color: #61afef;
      padding-left: 12px;
      border-left: 3px solid #61afef;
    }

    .log-entry.error {
      color: #e06c75;
      background: #2d1f1f;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #e06c75;
    }

    .modal-footer {
      display: flex;
      gap: 8px;
      padding: 16px 20px;
      border-top: 1px solid #e0e0e0;
      background: white;
    }

    .btn-copy-error {
      background: #fee2e2;
      color: #dc2626;
      display: none;
    }

    .btn-copy-error:hover {
      background: #fecaca;
    }

    .btn-copy-qa {
      background: #e0e7ff;
      color: #2563eb;
      display: none;
    }

    .btn-copy-qa:hover {
      background: #dbeafe;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 3000;
    }

    .toast.show {
      opacity: 1;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .status-badge.running {
      background: #fff3cd;
      color: #856404;
    }

    .status-badge.success {
      background: #d4edda;
      color: #155724;
    }

    .status-badge.error {
      background: #f8d7da;
      color: #721c24;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>📦 MD to Figma</h1>
  </div>

  <div class="template-section">
    <button class="btn-template" id="downloadTemplateBtn">📥 템플릿 받기</button>
    <button class="btn-template" id="downloadGuideBtn">📖 AI 가이드</button>
  </div>

  <div class="textarea-section">
    <div class="textarea-label">제공된 템플릿을 AI에게 제공하고 데이터를 맵핑해달라고 요청하세요.<br>그 결과인 DESIGN.md 내용을 아래에 붙여넣으세요.</div>
    <textarea id="mdContent" placeholder="# Design System

## Colors

### Primitive
| Token | Value | Description |
|-------|-------|-------------|
| rausch/500 | #ff385c | 브랜드 레드 |

### Semantic
| Token | Light | Dark | Description |
|-------|-------|------|-------------|
| brand/primary | rausch/500 | rausch/500 | 메인 컬러 |
..."></textarea>
  </div>

  <div class="options-section">
    <div class="options-group">
      <div class="options-title">📦 Variables (컬렉션 분리 생성)</div>
      <div class="options-grid">
        <div class="option-item"><input type="checkbox" id="optVarColors" checked><label
            for="optVarColors">Colors</label></div>
        <div class="option-item"><input type="checkbox" id="optVarSpacing" checked><label
            for="optVarSpacing">Spacing</label></div>
        <div class="option-item"><input type="checkbox" id="optVarRadius" checked><label
            for="optVarRadius">Radius</label></div>
        <div class="option-item"><input type="checkbox" id="optVarTypography" checked><label
            for="optVarTypography">Typography</label></div>
      </div>
    </div>
    <div class="options-divider"></div>
    <div class="options-group">
      <div class="options-title">🎨 Styles (Variable 연동)</div>
      <div class="options-grid">
        <div class="option-item"><input type="checkbox" id="optColorStyles"><label for="optColorStyles">Color
            Styles</label></div>
        <div class="option-item"><input type="checkbox" id="optTextStyles" checked><label for="optTextStyles">Text
            Styles</label></div>
        <div class="option-item"><input type="checkbox" id="optEffectStyles" checked><label for="optEffectStyles">Effect
            Styles</label></div>
        <div class="option-item"><input type="checkbox" id="optGridStyles" checked><label for="optGridStyles">Grid
            Styles</label></div>
      </div>
    </div>
  </div>

  <div class="button-section">
    <button class="btn btn-primary" id="generateBtn">🚀 등록 (MD → Figma)</button>
    <button class="btn btn-export" id="exportBtn">📤 추출 (Figma → MD)</button>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title-row">
          <span class="modal-title" id="modalTitle">실행 리포트</span>
          <span class="status-badge running" id="statusBadge"><span class="spinner"></span>작업 중</span>
        </div>
        <div class="tabs">
          <div class="tab" id="tabError" onclick="switchTab('error')">🔴 해결 필요 <span class="tab-badge"
              id="badgeError">0</span></div>
          <div class="tab" id="tabQA" onclick="switchTab('qa')">🔵 QA 리포트 <span class="tab-badge" id="badgeQA">0</span>
          </div>
        </div>
      </div>
      <div class="tab-content" id="contentError"></div>
      <div class="tab-content" id="contentQA"></div>
      <div class="modal-footer">
        <button class="btn btn-copy-error" id="copyErrorBtn">📋 AI에게 에러 해결 브리핑 복사</button>
        <button class="btn btn-copy-qa" id="copyQABtn">📋 AI에게 시스템 최적화 분석 복사</button>
        <button class="btn" style="background:#f0f0f0; color:#666; flex: 0.5;" id="closeModalBtn" disabled>닫기</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var TEMPLATE_MD = `# Design System

<!--
📌 작성 규칙

[형식]
- 컬러: HEX 6자리 (#ffffff) 또는 rgba(0,0,0,0.1)
- 크기: 숫자+px 필수 (16px, -1.5px)
- LineHeight: 소수점 (1.5) 또는 퍼센트 (150%)
- Weight: 숫자(400, 700) 또는 이름(Regular, Bold, SemiBold). 피그마 스타일명과 일치 권장.
- 빈 값: - 로 표기

[토큰 구조]
- Primitive: 기본 색상 팔레트 (원시값, 모드 무관)
- Semantic: 용도별 색상 (Light/Dark 모드별 Alias 지정)

[다크모드 규칙]
⚠️ 중요: Primitive에 Light/Dark 모두에서 사용할 모든 원시 컬러를 먼저 정의

1. Primitive 정의 (원시값)
   - Light 모드에서 사용할 컬러 정의
   - Dark 모드에서 사용할 컬러도 함께 정의

2. Semantic 정의 (Alias)
   - Light 컬럼: Light 모드에서 사용할 Primitive 토큰명
   - Dark 컬럼: Dark 모드에서 사용할 Primitive 토큰명
   - ⚠️ HEX 직접 입력 금지 — 반드시 Primitive 토큰명(Alias) 사용

[다크모드 추론 가이드]
원본에 다크모드가 없으면 아래 패턴으로 추론:
- surface/canvas: Light=white → Dark=gray-900
- surface/card: Light=white → Dark=gray-800
- surface/elevated: Light=gray-50 → Dark=gray-700
- text/default: Light=gray-900 → Dark=gray-50
- text/muted: Light=gray-500 → Dark=gray-400
- border/default: Light=gray-200 → Dark=gray-700
- brand/primary: 보통 동일하게 유지
- feedback/*: 동일하거나 밝기 +10~20%

[네이밍]
- 허용: 영문, 숫자, /, -, _
- 금지: 공백, 괄호, 특수문자
- ⚠️ 숫자로 시작 금지
- 경로 구분: / 사용 (group/token)

[Typography 그룹핑]
- ### 그룹명 으로 그룹 구분 (예: ### Display)
- 예: ### Display 아래 xl → display/xl
-->

## Effects

    var mdContent = document.getElementById('mdContent');
    var modalOverlay = document.getElementById('modalOverlay');
    var contentError = document.getElementById('contentError');
    var contentQA = document.getElementById('contentQA');
    var badgeError = document.getElementById('badgeError');
    var badgeQA = document.getElementById('badgeQA');
    var copyErrorBtn = document.getElementById('copyErrorBtn');
    var copyQABtn = document.getElementById('copyQABtn');
    var closeModalBtn = document.getElementById('closeModalBtn');
    var statusBadge = document.getElementById('statusBadge');
    var toast = document.getElementById('toast');

    var errorLogs = [];
    var qaLogs = [];

    document.getElementById('downloadTemplateBtn').onclick = () => downloadFile('DESIGN-TEMPLATE.md', TEMPLATE_MD);
    document.getElementById('downloadGuideBtn').onclick = () => downloadFile('AI-PROMPT-GUIDE.md', AI_PROMPT_GUIDE);

    function downloadFile(filename, content) {
      var blob = new Blob([content], { type: 'text/markdown' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); showToast('📥 다운로드 완료!');
    }

    document.getElementById('generateBtn').onclick = function () {
      var content = mdContent.value.trim();
      if (!content) { showToast('⚠️ 내용을 붙여넣으세요'); return; }
      openModal('등록 중...');

      // 체크박스 옵션 수집 (복구됨)
      var options = {
        variables: {
          colors: document.getElementById('optVarColors').checked,
          spacing: document.getElementById('optVarSpacing').checked,
          radius: document.getElementById('optVarRadius').checked,
          typography: document.getElementById('optVarTypography').checked
        },
        styles: {
          color: document.getElementById('optColorStyles').checked,
          text: document.getElementById('optTextStyles').checked,
          effect: document.getElementById('optEffectStyles').checked,
          grid: document.getElementById('optGridStyles').checked
        }
      };
      parent.postMessage({ pluginMessage: { type: 'generate', content: content, options: options } }, '*');
    };

    document.getElementById('exportBtn').onclick = function () {
      openModal('데이터 추출 및 무결성 검사 중...');
      parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
    };

    function openModal(title) {
      document.getElementById('modalTitle').textContent = title;
      errorLogs = []; qaLogs = [];
      contentError.innerHTML = ''; contentQA.innerHTML = '';
      updateBadges();
      closeModalBtn.disabled = true;
      statusBadge.className = 'status-badge running';
      statusBadge.innerHTML = '<span class="spinner"></span>진행 중';
      modalOverlay.classList.add('show');
      switchTab('qa');
    }

    function switchTab(tabId) {
      document.getElementById('tabError').classList.remove('active');
      document.getElementById('tabQA').classList.remove('active');
      contentError.classList.remove('active');
      contentQA.classList.remove('active');
      copyErrorBtn.style.display = 'none';
      copyQABtn.style.display = 'none';

      if (tabId === 'error') {
        document.getElementById('tabError').classList.add('active');
        contentError.classList.add('active');
        copyErrorBtn.style.display = 'block';
      } else {
        document.getElementById('tabQA').classList.add('active');
        contentQA.classList.add('active');
        copyQABtn.style.display = 'block';
      }
    }

    function updateBadges() {
      badgeError.textContent = errorLogs.length;
      badgeQA.textContent = qaLogs.length;
      if (errorLogs.length > 0) switchTab('error');
    }

    copyErrorBtn.onclick = function () {
      var prompt = "너는 디자인 시스템 전문가야. 아래는 MD to Figma 플러그인에서 발생한 치명적 등록 실패 리포트야. 이 에러들을 분석해서 원본 DESIGN.md 코드에서 어떤 부분이 틀렸는지 정확히 짚어주고, 수정된 전체 코드를 다시 작성해 줘.\n\n--- [에러 리포트] ---\n" + errorLogs.join('\n');
      copyToClipboard(prompt, '🔴 에러 브리핑 복사 완료!');
    };

    copyQABtn.onclick = function () {
      var prompt = "너는 시니어 디자인 시스템 엔지니어 전문가야. 아래는 내 디자인 데이터를 피그마 플러그인이 자동으로 교정한 내역과 추출 시의 무결성 복구 리포트야. 이 내용을 바탕으로 내 디자인 시스템의 일관성을 높일 수 있는 가이드라인을 작성해 주고, 개선사항이 반영된 피드백을 줘.\n\n--- [QA 리포트] ---\n" + qaLogs.join('\n');
      copyToClipboard(prompt, '🔵 QA 브리핑 복사 완료!');
    };

    function copyToClipboard(text, successMsg) {
      navigator.clipboard.writeText(text).then(() => showToast(successMsg)).catch(err => {
        const textarea = document.createElement('textarea');
        textarea.value = text; document.body.appendChild(textarea); textarea.select();
        document.execCommand('copy'); document.body.removeChild(textarea); showToast(successMsg);
      });
    }

    function showToast(message) {
      toast.textContent = message; toast.classList.add('show');
      setTimeout(function () { toast.classList.remove('show'); }, 2500);
    }

    closeModalBtn.onclick = function () { modalOverlay.classList.remove('show'); };

    window.onmessage = function (event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'log') {
        var entry = document.createElement('div');
        entry.className = 'log-entry info';
        entry.textContent = msg.message;
        contentQA.appendChild(entry);
        contentQA.scrollTop = contentQA.scrollHeight;
      }
      else if (msg.type === 'qa_log') {
        qaLogs.push(msg.message);
        var entry = document.createElement('div');
        entry.className = 'log-entry qa';
        entry.textContent = "ℹ️ " + msg.message;
        contentQA.appendChild(entry);
        contentQA.scrollTop = contentQA.scrollHeight;
        updateBadges();
      }
      else if (msg.type === 'error') {
        var fullError = msg.message + (msg.detail ? "\n상세: " + msg.detail : "");
        errorLogs.push(fullError);
        var entry = document.createElement('div');
        entry.className = 'log-entry error';
        entry.textContent = "❌ " + fullError;
        contentError.appendChild(entry);
        contentError.scrollTop = contentError.scrollHeight;
        updateBadges();
      }
      else if (msg.type === 'complete' || msg.type === 'export_complete') {
        closeModalBtn.disabled = false;
        if (errorLogs.length === 0) {
          statusBadge.className = 'status-badge success'; statusBadge.innerHTML = '✅ 완료';
        } else {
          statusBadge.className = 'status-badge error'; statusBadge.innerHTML = '⚠️ 에러 있음';
        }

        if (msg.type === 'export_complete') {
          document.getElementById('modalTitle').textContent = '✅ 추출 및 다운로드 완료';
          downloadFile('EXPORTED-DESIGN.md', msg.mdContent);
          // Export 시에는 QA 탭에 추출된 내용을 뿌리지 않습니다.
          var entry = document.createElement('div');
          entry.className = 'log-entry success';
          entry.textContent = "\n✅ 디자인 시스템 데이터 추출이 완료되어 다운로드가 시작되었습니다.";
          contentQA.appendChild(entry);
          contentQA.scrollTop = contentQA.scrollHeight;
        } else if (msg.type === 'complete') {
          document.getElementById('modalTitle').textContent = '🎉 등록 프로세스 완료';
          var entry = document.createElement('div');
          entry.className = 'log-entry success';
          entry.textContent = "\n🎉 모든 시스템이 성공적으로 이식되었습니다!";
          contentQA.appendChild(entry);
          contentQA.scrollTop = contentQA.scrollHeight;
        }
      }
    };
  </script>
